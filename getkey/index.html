<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quicklink Admin Dashboard</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/limonte-sweetalert2/11.1.0/sweetalert2.all.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; padding-top: 50px; }
        .card { box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-radius: 15px; }
        .btn-primary { border-radius: 10px; padding: 10px 25px; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-4">
                <h2 class="text-center mb-4">⚙️ Setup Quicklink</h2>

                <div class="mb-3">
                    <label class="form-label">Quicklink API 1 (Lớp ngoài)</label>
                    <input type="text" id="ql1" class="form-control" placeholder="https://site1.com/api?api=key&url=">
                </div>

                <div class="mb-3">
                    <input type="text" id="ql2" class="form-control" placeholder="https://site2.com/api?api=key&url=">
                </div>

                <div class="mb-3" hidden>
                    <input type="text" id="endpoint" class="form-control" value="https://key.gmvmoba.com/public/test/index.php">
                </div>

                <button class="btn btn-primary w-100" onclick="saveToGithub()">Lưu Cấu Hình</button>
                <div id="status" class="mt-3 text-center"></div>
                  <hr>
                 <div class="card border-0 bg-light shadow-sm">
            <div class="card-body">
                <label class="fw-bold text-muted mb-2">Link GETKEY công khai của bạn</label>
                <div class="input-group">
                    <input type="text" class="form-control bg-white" value="https://gmvmoba.com/getkey/gameapk/index.html" id="getkeyLink" readonly="">
                    <button class="btn btn-dark" type="button" onclick="copyGetKey()">Copy</button>
                </div>
            </div>
        </div>
            </div>
        </div>
    
    </div>
</div>

<script>

    function copyGetKey() {
    const copyText = document.getElementById("getkeyLink");
    copyText.select();
    navigator.clipboard.writeText(copyText.value).then(() => {
        Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Đã copy link!', showConfirmButton: false, timer: 1500 });
    });
}
async function saveToGithub() {
    const ql1 = document.getElementById('ql1').value;
    const ql2 = document.getElementById('ql2').value;
    const endpoint = document.getElementById('endpoint').value;
    const status = document.getElementById('status');

    status.innerHTML = "⏳ Đang lưu...";

    try {
        const res = await fetch("https://nameless-credit-5cd3.teamgamehub99.workers.dev", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ ql1, ql2, endpoint })
        });

        if (res.ok) {
            status.innerHTML = "<span class='text-success'>✅ Đã lưu thành công! thông tin mới sẽ được update sau 1-5 phút</span>";
        } else {
            status.innerHTML = "<span class='text-danger'>❌ Lỗi khi lưu.</span>";
        }

    } catch (e) {
        status.innerHTML = "<span class='text-danger'>❌ Lỗi kết nối.</span>";
    }
}
</script>
</body>
</html>
