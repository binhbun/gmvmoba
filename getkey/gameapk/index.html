
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Key</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --primary-color: #1ad5fa;
            --secondary-color: #ffc107;
            --bg-dark: #0a0a0c;
            --card-bg: #16161a;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 212, 255, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 193, 7, 0.05) 0%, transparent 20%);
            color: #e0e0e0;
            font-family: 'Lexend', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            margin: 0;
        }

        .card-gaming {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border: 3px solid var(--primary-color);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            padding: 5px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 100%;
        }

        .title-glitch {
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 2px 2px var(--primary-color);
        }

        .btn-action {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            font-weight: 700;
            padding: 15px;
            transition: 0.3s;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }

        .btn-primary-gaming {
            background: linear-gradient(135deg, #007bff, #00d4ff);
            border: none;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
        }

        .btn-primary-gaming:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.6);
            color: white;
        }

        /* CSS MỚI CHO DISCORD */
        .btn-discord {
            background: #5865F2;
            border: none;
            color: white;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4);
        }

        .btn-discord:hover {
            background: #4752C4;
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.6);
            color: white;
        }

        .btn-outline-warning-gaming {
            border: 2px solid var(--secondary-color);
            color: var(--secondary-color);
            background: transparent;
        }

        .btn-outline-warning-gaming:hover {
            background: var(--secondary-color);
            color: #000;
            box-shadow: 0 0 15px rgba(255, 193, 7, 0.4);
        }

        .loader-container {
            display: none;
            padding: 20px;
        }

        .spinner-border {
            width: 3.5rem;
            height: 3.5rem;
            color: var(--primary-color) !important;
        }

        .pulse {
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-sm-10">
            <div class="card card-gaming text-center">
                
                <div id="main-content">
                    <div class="mb-4">
                        <i class="bi bi-controller text-primary" style="font-size: 3rem;"></i>
                    </div>
                    <h3 class="title-glitch mb-2">🚀 FREE KEY 🚀</h3>
                    <p class="mt-4 extra-small text-white" style="font-size: 0.7rem;">Hệ thống cấp key tự động by <b>ngocbonggaming</b></p>
                    
                    <div class="d-grid gap-3 col-11 mx-auto">
                        <button id="btnAction" onclick="startGenerate()" class="btn btn-action btn-primary-gaming">
                            <i class="bi bi-lightning-charge-fill"></i> LẤY KEY FREE
                        </button>

                      <div class="row g-2">
                        <div class="col-6">
                                                        <a href="https://discord.gg/MmNsHNDf43" target="_blank" class="btn btn-action btn-discord h-100">
                                <i class="bi bi-discord"></i> DISCORD
                            </a>
                        </div>
                        
                        <div class="col-6">
                                                        <a href="https://key.gmvmoba.com/" target="_blank" class="btn btn-action btn-outline-warning-gaming h-100">
                                <i class="bi bi-cart-check"></i> MUA KEY
                            </a>
                        </div>
                    </div>
                    </div>

                    <p class="mt-4 extra-small text-white" style="font-size: 0.7rem;">
                        Bằng cách nhấn nút, bạn đồng ý với các điều khoản của chúng tôi.
                    </p>
                </div>

                <div id="loader" class="loader-container">
                    <div class="spinner-border mb-3" role="status"></div>
                    <h5 class="text-primary pulse">ĐANG KIỂM TRA IP...</h5>
                    <p class="text-white small">Vui lòng không đóng trình duyệt hoặc quay lại.</p>
                </div>

            </div>
        </div>
    </div>
</div>

<script>
async function startGenerate() {
    const loader = document.getElementById('loader');
    const mainContent = document.getElementById('main-content');

    mainContent.style.display = 'none';
    loader.style.display = 'block';
    start();
}
</script>
<script>
async function start() {
    try {
        const res = await fetch('../../config.json?t=' + Date.now());
        const data = await res.json();

        if (!data.quicklink_1 || !data.quicklink_2 || !data.endpoint) {
            throw new Error("Thiếu config");
        }

        // Step 1
        const step2 = data.quicklink_2 + encodeURIComponent(data.endpoint);

        // Step 2
        const final = data.quicklink_1 + encodeURIComponent(step2);

        // Fix absolute URL
        window.location.replace(new URL(final).href);

    } catch (e) {
        document.body.innerHTML = "Lỗi vui lòng liên hệ admin zalo: 0965870531.";
        console.error(e);
    }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
