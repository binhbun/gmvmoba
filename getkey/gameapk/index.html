    <script>
        async function start() {
            try {
                const res = await fetch('../../config.json?t=' + Date.now());

                window.location.href = final;
            } catch (e) {
                document.write("Lỗi vui lòng liên hệ admin zalo: 0965870531.");
            }
        }
        start();
    </script>
