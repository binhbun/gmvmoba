<script>

})();
</script>

<script>
async function getIP() {
    try {
        let res = await fetch("https://api.ipify.org?format=json");
        let data = await res.json();
        return data.ip;
    } catch {
        return "UNKNOWN";
    }
}

async function generateCodeIfNeeded() {

    if (!window.isFirstVisit) return;

    const prefix = "GMVMOBA_";

    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    let random = "";
    for (let i = 0; i < 5; i++) {
        random += chars[Math.floor(Math.random() * chars.length)];
    }

    let ip = "UNKNOWN";
    try {
        let res = await fetch("https://api.ipify.org?format=json");
        ip = (await res.json()).ip;
    } catch {}

    const final = `${prefix}${random}_${ip}`;
    document.getElementById("GetKeyViewTextBox").value = final;
}

window.onload = generateCodeIfNeeded;

document.getElementById("GetKeyBtn_Label").addEventListener("click", function() {
    const input = document.getElementById("GetKeyViewTextBox");
    input.select();
    document.execCommand("copy");

    Swal.fire("Thành công!", "Đã sao chép code!", "success");
});

 
</script>
<script>
(function () {

    const nav = performance.getEntriesByType("navigation")[0].type;

    if (nav === "reload") {
        document.body.classList.remove("protected");
        return;
    }

    if (!sessionStorage.getItem("session_ok")) {
        sessionStorage.setItem("session_ok", "1");
        document.body.classList.remove("protected");
        return;
    }

    showError();
    return;

    function showError() {
        document.getElementById("refWarning").style.display = "flex";
        setTimeout(() => {
            window.location.href = "https://bbmkts.com/go/codevipfree";
        }, 2000);
    }

})();
</script>
