name: Firebase Smart Cleanup

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  smart_clear:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run Cleanup Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/workflows/cleanup.js
