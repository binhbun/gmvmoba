name: Firebase Cleanup ALL

on:
  schedule:
    # 17:00 UTC tương ứng với 00:00 giờ Việt Nam (UTC+7)
    - cron: '0 17 * * *'
  workflow_dispatch: # Cho phép chạy thủ công khi cần

jobs:
  smart_clear:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install firebase-admin --no-audit --no-fund

      - name: Run Cleanup Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/workflows/cleanupall.js
