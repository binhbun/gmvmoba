name: Auto Generate GMVMOBA Keys
on:
  schedule:
    - cron: '*/15 * * * *' # Chạy mỗi 30 phút
  workflow_dispatch: # Nút bấm chạy thủ công

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Chạy Bot tạo Key
        env:
          LCQ_USER: ${{ secrets.LCQ_USER }}
          LCQ_PASS: ${{ secrets.LCQ_PASS }}
          GSHEET_URL: ${{ secrets.GSHEET_URL }}
        run: |
          pip install requests
          python - <<EOF
          import requests, re, os, uuid

          def run_bot():
              gsheet_url = os.getenv('GSHEET_URL')
              user = os.getenv('LCQ_USER')
              pw = os.getenv('LCQ_PASS')

              # 1. Kiểm tra số lượng hiện tại
              try:
                  res_check = requests.get(f"{gsheet_url}?check=1")
                  count = int(res_check.text)
              except:
                  count = 0
              
              print(f"Số lượng hiện tại: {count}")

              if count < 50:
                  num_needed = 100 - count
                  print(f"Cần tạo thêm {num_needed} key...")
                  
                  session = requests.Session()
                  # Đăng nhập (Dựa trên thông tin lcqmod.site)
                  login_page = session.get("https://lcqmod.site/public/login")
                  csrf = re.search(r'name="csrf_test_name" value="([^"]+)"', login_page.text).group(1)
                  
                  session.post("https://lcqmod.site/public/login", data={
                      'csrf_test_name': csrf, 'username': user, 'password': pw
                  })

                  for _ in range(num_needed):
                      # Tạo chuỗi ngẫu nhiên cho custom_key
                      random_str = str(uuid.uuid4()).upper()[:10]
                      custom_key = f"GMVMOBA_{random_str}"
                      
                      # Lấy CSRF tạo key
                      gen_page = session.get("https://lcqmod.site/public/keys/generate")
                      csrf_gen = re.search(r'name="csrf_test_name" value="([^"]+)"', gen_page.text).group(1)
                      
                      payload = {
                          'csrf_test_name': csrf_gen,
                          'game': 'ALL',
                          'custom_key': custom_key,
                          'max_devices': '1',
                          'duration': '1',
                          'key_level': '2',
                          'quantity': '1'
                      }
                      
                      res = session.post("https://lcqmod.site/public/keys/generate", data=payload)
                      
                      # Kiểm tra nếu tạo thành công (Tìm lại key có tiền tố GMVMOBA_)
                      match = re.search(r'(GMVMOBA_[A-Z0-9]+)', res.text)
                      if match:
                          new_key = match.group(1)
                          requests.get(f"{gsheet_url}?newkey={new_key}")
                          print(f"Đã tạo & nạp: {new_key}")
              else:
                  print("Số lượng key vẫn đủ, không cần tạo thêm.")

          run_bot()
          EOF
