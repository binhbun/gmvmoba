        document.body.style.filter = `brightness(${window.solBrightness}%)`;
        
        let solDeviceId = localStorage.getItem('sol_device_id');
        if (!solDeviceId) { solDeviceId = 'DEV-' + Math.random().toString(36).substr(2, 10) + '-' + Date.now(); localStorage.setItem('sol_device_id', solDeviceId); }
        let clientDevice = (function() { const ua = navigator.userAgent; let osVer = ''; const iosMatch = ua.match(/OS (\d+[_.]\d+)/); if (iosMatch) osVer = ' iOS ' + iosMatch[1].replace('_', '.'); if (/iPhone/.test(ua)) { return 'iPhone' + osVer; } if (/Android/.test(ua)) { const m = ua.match(/Android.*?; (.*?) Build/); return m ? m[1].trim() : 'Android'; } if (/Windows NT/.test(ua)) return 'Windows PC'; return 'Thiết bị Web'; })();
        
        let clientIP = 'Đang lấy...';
        fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d=>{ clientIP = d.ip; document.querySelectorAll('.live-ip-display').forEach(e=>e.innerText=clientIP); }).catch(e=>{ clientIP='Lỗi API'; });
        
        const urlParams = new URLSearchParams(window.location.search);
        const magicToken = urlParams.get('token');
        if (magicToken && !isLoggedIn) {
            Swal.fire({ html:'<div class="neon-popup-content" style="font-size:16px;">ĐANG XÁC THỰC LINK...</div>', background:'rgba(15,8,30,0.98)', allowOutsideClick:false, didOpen:()=>Swal.showLoading() });
            const fd = new URLSearchParams(); fd.append('action', 'login_magic'); fd.append('csrf_token', csrf); fd.append('magic_token', magicToken); fd.append('device_id', solDeviceId); fd.append('device_info', clientDevice);
            fetch('', {method: 'POST', body: fd}).then(r=>r.json()).then(d=>{ if(d.s==='success'){ window.history.replaceState({}, document.title, window.location.pathname); location.reload(); } else { Swal.fire({icon:'error', title:'LỖI', text:d.m, customClass:{popup:'swal-sol-popup', confirmButton:'sol-btn-ok'}}); } });
        }
        
        const dict = { vi: { tab_login:"Đăng nhập", tab_video:"Hướng Dẫn", tab_aim:"Aimbot", tab_acc:"Tài khoản", login_title:"ĐĂNG NHẬP" }, en: { tab_login:"Login", tab_video:"Tutorial", tab_aim:"Aimbot", tab_acc:"Account", login_title:"LOGIN" } };
        let curLang = localStorage.getItem('sol_lang') || 'vi';
        function t(k){ return dict[curLang][k] || k; }
        
        document.getElementById('langToggle').onclick = ()=>{ curLang = curLang==='vi'?'en':'vi'; localStorage.setItem('sol_lang', curLang); document.getElementById('langToggle').innerText = curLang.toUpperCase(); if(document.getElementById('gameModalOverlay').classList.contains('active')){ renderUserBar(); switchTab(currentTab); } };
        document.getElementById('langToggle').innerText = curLang.toUpperCase();
        
        function handleKick(){ if(window.isKickedOut)return; window.isKickedOut=true; localStorage.removeItem('sol_active_aim'); localStorage.removeItem('sol_free_expire'); Swal.fire({ html:'<div class="neon-popup-content" style="font-size:16px;">TÀI KHOẢN ĐÃ HẾT HẠN</div>', customClass:{popup:'swal-sol-popup swal-sol-kick',confirmButton:'sol-btn-kick'} }).then(()=>location.reload()); }
        
        const overlay = document.getElementById('gameModalOverlay'); const contentDiv = document.getElementById('gameContent'); let currentTab = isLoggedIn ? 'aim' : 'login';
        document.getElementById('settingBtn').onclick = ()=>{ overlay.classList.add('active'); renderUserBar(); switchTab(currentTab); };
        document.getElementById('modalCloseBtn').onclick = ()=> overlay.classList.remove('active'); overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.classList.remove('active'); });
        
        function renderUserBar(){
            if(isLoggedIn){
                document.getElementById('sidebarMenu').innerHTML = `<img src="${defaultAvatar}" class="user-avatar-mini" id="miniAvatar" title="Đổi Avatar"><span class="user-name-mini">${displayName}</span><div class="mini-tabs"><button class="mini-tab ${currentTab==='aim'?'active':''}" data-tab="aim"><i class="fas fa-crosshairs"></i> ${t('tab_aim')}</button><button class="mini-tab ${currentTab==='account'?'active':''}" data-tab="account"><i class="fas fa-user-astronaut"></i> ${t('tab_acc')}</button><button class="mini-tab ${currentTab==='settings'?'active':''}" data-tab="settings"><i class="fas fa-cog"></i> Cài Đặt Giao Diện</button></div>`;
                document.getElementById('miniAvatar').onclick = ()=> document.getElementById('globalAvatarInput').click();
            } else { 
                document.getElementById('sidebarMenu').innerHTML = `<div class="mini-tabs"><button class="mini-tab ${currentTab==='login'?'active':''}" data-tab="login"><i class="fas fa-sign-in-alt"></i> ${t('tab_login')}</button><button class="mini-tab ${currentTab==='video'?'active':''}" data-tab="video"><i class="fas fa-play"></i> ${t('tab_video')}</button></div>`; 
            }
            document.querySelectorAll('.mini-tab[data-tab]').forEach(b=> b.onclick = function(){ currentTab = this.dataset.tab; renderUserBar(); switchTab(currentTab); });
        }
        
        function renderAimItem(id, name, errorNote = ''){ 
            let isChecked = activeAim === id; 
            let isDisabled = activeAim !== null && activeAim !== id; 
            let activeText = isChecked ? '<span style="color:var(--purp); font-size:10px; font-weight:800; margin-right:10px; text-shadow:0 0 15px rgba(139,92,246,0.8);">ĐANG BẬT</span>' : ''; 
            let noteHtml = errorNote ? ` <span class="aim-error-note">${errorNote}</span>` : ''; 
            return `<div class="aim-card ${isDisabled ? 'disabled' : ''}" data-id="${id}"><span style="font-size:13px; font-weight:700; color:${isDisabled ? 'rgba(255,255,255,0.6)' : '#fff'}; display:flex; align-items:center;">${name}${noteHtml}</span><div style="display:flex; align-items:center;">${activeText}<label class="switch"><input type="checkbox" class="aim-switch-input" data-id="${id}" ${isChecked?'checked':''} ${isDisabled?'disabled':''}><span class="slider"></span></label></div></div>`; 
        }
        
        function switchTab(tab){
            let html='';
            if(!isLoggedIn){ 
                if(tab==='login'){ html=`<div style="width:100%;max-width:280px;margin:30px auto;text-align:center;"><h3 style="font-family:'Orbitron';color:#fff;margin-bottom:20px;letter-spacing:2px;"><i class="fas fa-bolt" style="color:var(--purp);"></i> ${t('login_title')}</h3><div style="color:rgba(255,255,255,0.7); font-size:13px; margin-bottom:30px; line-height: 1.6;">Hệ thống đăng nhập bằng Link 1 chạm.<br>Vui lòng lấy Link Truy Cập để vào menu.</div><a href="https://solitudepremium.click/ngoc/key.php" class="game-btn" style="text-decoration:none; display:inline-block; text-align:center; padding:15px; font-size: 14px; border-radius: 12px;">🌐 ĐẾN TRANG TẠO LINK</a></div>`; } 
                else if(tab==='video'){ html=`<div style="text-align:center;padding:50px 10px;"><a href="https://drive.google.com/file/d/1VEX8MhcaV--9x8QzlriN7L5BnvCCPUlz/view?usp=drivesdk" target="_blank" class="game-btn" style="background: linear-gradient(135deg, #be185d, var(--pink)); display:inline-block; text-decoration:none; color:#fff; border-radius: 12px;"><i class="fas fa-play-circle"></i> Xem Hướng Dẫn</a></div>`; } 
            } else {
                if(tab==='aim'){ 
                    html=`<div style="width:100%;max-width:340px;margin:0 auto;padding-top:5px;">
                    <h4 style="color:#fff;margin-bottom:18px;display:flex;align-items:center;gap:8px;font-size:15px;font-family:'Orbitron';"><i class="fas fa-crosshairs"></i> AIMBOT VIP</h4>
                    <div class="aim-card" style="background:rgba(0,0,0,0.2);cursor:default;box-shadow:none;border:1px dashed rgba(255,255,255,0.2);">
                        <span style="font-size:12px;font-weight:700;color:rgba(255,255,255,0.8);display:flex;align-items:center;gap:6px;"><i class="fas fa-server"></i> Máy chủ: <span id="serverHostname" style="color:#fff;margin-left:4px;cursor:pointer;">solitudeversion.duckdns.org</span></span>
                    </div>
                    ${renderAimItem('aim_antena','Aim Antena')}
                    ${renderAimItem('no_antena','Aim No Antena')}
                    ${renderAimItem('aim_body_antena','Aim Body No Antena')}
                    ${renderAimItem('server_aimco','Aim Server 2019')}
                    ${renderAimItem('aim_chest','Aim Ngực')}
                    ${renderAimItem('aim_co_v2','Aim Cổ')}
                    ${renderAimItem('aim_long_neck','Aim Cổ Dài')}
                    </div>`; 
                }
                else if(tab==='account'){ html=`<div style="width:100%;max-width:320px;margin:0 auto;"><div style="text-align:center;margin-bottom:20px;"><img id="accountAvatarImg" src="${defaultAvatar}" class="account-avatar-img"><div style="font-size:11px;color:rgba(255,255,255,0.6);margin-top:12px;">[ BẤM ĐỂ ĐỔI ẢNH ]</div></div><div style="background:rgba(0,0,0,0.3);padding:18px;border-radius:16px;font-size:13px;margin-bottom:15px;border:1px solid rgba(255,255,255,0.1);color:#fff;backdrop-filter:blur(10px);"><div style="display:flex;justify-content:space-between;margin-bottom:12px;border-bottom:1px dashed rgba(255,255,255,0.1);padding-bottom:8px;align-items:center;"><span style="color:rgba(255,255,255,0.7);">Tài khoản:</span> <b id="btnChangeName" style="cursor:pointer;color:#fff;background:rgba(255,255,255,0.1);padding:4px 8px;border-radius:6px;">${displayName} <i class="fas fa-edit" style="font-size:10px;margin-left:4px;"></i></b></div><div style="display:flex;justify-content:space-between;margin-bottom:12px;border-bottom:1px dashed rgba(255,255,255,0.1);padding-bottom:8px;"><span style="color:rgba(255,255,255,0.7);">Chức vụ:</span> <b style="color:var(--purp);text-transform:uppercase;">${accountRole}</b></div><div style="display:flex;justify-content:space-between;padding-bottom:4px;"><span style="color:rgba(255,255,255,0.7);">Gói thẻ:</span> <b style="color:#fff;text-transform:uppercase;">${accountType}</b></div></div></div>`; }
                else if(tab==='settings'){ html=`<div style="width:100%;max-width:320px;margin:0 auto;padding-top:5px; color:#fff;"><h4 style="color:#fff;margin-bottom:25px;display:flex;align-items:center;gap:8px;font-family:'Orbitron';"><i class="fas fa-cog"></i> CÀI ĐẶT GIAO DIỆN</h4><div style="background:rgba(0,0,0,0.3);padding:20px;border-radius:16px;border:1px solid rgba(255,255,255,0.1);margin-bottom:15px;backdrop-filter:blur(10px);"><label style="font-size:13px;color:rgba(255,255,255,0.8);display:flex;justify-content:space-between;">Độ sáng: <b id="brightValText" style="color:#fff;">${window.solBrightness}%</b></label><input type="range" id="brightSlider" min="20" max="150" value="${window.solBrightness}" style="width:100%;margin-top:12px;accent-color:var(--purp);"></div></div>`; }
            }
            contentDiv.innerHTML = html;
            if(isLoggedIn){
                if(tab==='account'){
                    document.getElementById('accountAvatarImg').onclick = ()=> document.getElementById('globalAvatarInput').click();
                    document.getElementById('btnChangeName').onclick = ()=>{
                        Swal.fire({ title:'ĐỔI TÊN', input:'text', inputValue:displayName, customClass:{popup:'swal-sol-popup',confirmButton:'sol-btn-ok'} }).then(async res=>{ if(res.isConfirmed){ const fd = new URLSearchParams(); fd.append('action','change_name'); fd.append('csrf_token',csrf); fd.append('new_name',res.value.trim()); const r = await fetch('',{method:'POST',body:fd}); const d = await r.json(); if(d.s==='success') location.reload(); } });
                    };
                }
                if(tab==='aim'){
                    document.querySelectorAll('.aim-card').forEach(card=>{
                        card.addEventListener('click', function(e){
                            if(e.target.tagName==='INPUT' || (e.target.tagName==='SPAN' && e.target.classList.contains('slider'))) return;
                            let id = this.getAttribute('data-id');
                            if(!this.classList.contains('disabled')) handleAimToggle(id);
                        });
                    });
                    document.querySelectorAll('.aim-switch-input').forEach(inp=> inp.addEventListener('change', function(){ handleAimToggle(this.dataset.id); }));
                }
            }
        }
        
        async function handleAimToggle(id){
            if(window.isTogglingAim) return;
            window.isTogglingAim = true;
            let isTurningOn = (activeAim !== id);
            if(isTurningOn && activeAim !== null){
                Swal.fire({html:'<div class="neon-popup-content">⚠️ VUI LÒNG TẮT AIM HIỆN TẠI TRƯỚC</div>', customClass:{popup:'swal-sol-popup', confirmButton:'sol-btn-ok'}});
                window.isTogglingAim = false;
                return;
            }
            const fd = new URLSearchParams(); fd.append('action','toggle_aim'); fd.append('csrf_token',csrf); fd.append('aim_id',id); fd.append('state',isTurningOn?1:0); fd.append('client_ip',clientIP);
            Swal.fire({title:'Đang kết nối Server...', allowOutsideClick:false, customClass:{popup:'swal-sol-popup'}, didOpen:()=>Swal.showLoading()});
            try{
                const r = await fetch('',{method:'POST',body:fd}); const d = await r.json();
                if(d.kick){ handleKick(); return; }
                if(d.s==='success' && isTurningOn){
                    Swal.fire({
                        html: `<div class="neon-popup-content">✔️ ĐÃ KÍCH HOẠT<br><span class="neon-port-text">CỔNG: ${d.port}</span></div>`,
                        showConfirmButton: false, timer: 2000, customClass: { popup: 'swal-sol-popup' }
                    }).then(()=> location.reload());
                }
                else if(d.s==='success' && !isTurningOn){
                    let cooldownUntil = d.cooldown_until || (Math.floor(Date.now()/1000) + 5);
                    let secondsLeft = Math.max(0, cooldownUntil - Math.floor(Date.now()/1000));
                    let timerInterval;
                    Swal.fire({
                        html: `<div class="neon-popup-content" style="font-size:14px;">⏳ ĐÃ TẮT AIM<br><span class="countdown-text" id="cooldownTimer">${secondsLeft}</span><br><span style="color:rgba(255,255,255,0.6)">VUI LÒNG CHỜ ĐỂ KÍCH HOẠT AIM MỚI</span></div>`,
                        showConfirmButton: false, allowOutsideClick: false, timer: secondsLeft * 1000, timerProgressBar: true, customClass: { popup: 'swal-sol-popup' },
                        didOpen: () => {
                            const timerEl = document.getElementById('cooldownTimer');
                            let remaining = secondsLeft;
                            timerInterval = setInterval(() => { remaining--; if (remaining >= 0) timerEl.textContent = remaining; }, 1000);
                        },
                        willClose: () => { clearInterval(timerInterval); location.reload(); }
                    });
                }
                else if(d.s==='cooldown'){
                    let cooldownUntil = d.cooldown_until || (Math.floor(Date.now()/1000) + (d.remain || 5));
                    let secondsLeft = Math.max(0, cooldownUntil - Math.floor(Date.now()/1000));
                    let timerInterval;
                    Swal.fire({
                        html: `<div class="neon-popup-content">⏳ VUI LÒNG CHỜ<br><span class="countdown-text" id="cooldownTimer">${secondsLeft}</span><br><span style="font-size:16px;">GIÂY</span></div>`,
                        showConfirmButton: false, allowOutsideClick: false, timer: secondsLeft * 1000, timerProgressBar: true, customClass: { popup: 'swal-sol-popup' },
                        didOpen: () => {
                            const timerEl = document.getElementById('cooldownTimer');
                            let remaining = secondsLeft;
                            timerInterval = setInterval(() => { remaining--; if (remaining >= 0) timerEl.textContent = remaining; }, 1000);
                        },
                        willClose: () => { clearInterval(timerInterval); location.reload(); }
                    });
                }
                else if(d.s==='error'){ Swal.fire({icon:'error',text:d.m, customClass:{popup:'swal-sol-popup', confirmButton:'sol-btn-ok'}}); }
            } catch(e){ Swal.fire({icon:'error', text:'Lỗi kết nối', customClass:{popup:'swal-sol-popup', confirmButton:'sol-btn-ok'}}); }
            window.isTogglingAim = false;
        }
        
        function initOrientation(){
            const blocker = document.getElementById('landscapeBlocker');
            function onLandscapeSuccess(){ blocker.style.display='none'; }
            function onPortrait(){ blocker.style.display='flex'; }
            if(window.matchMedia("(orientation: landscape)").matches) onLandscapeSuccess(); else onPortrait();
            window.matchMedia("(orientation: landscape)").addEventListener('change', e=> e.matches? onLandscapeSuccess() : onPortrait());
        }
        initOrientation();
        
        const overlayEl = document.getElementById('gameModalOverlay');
        if (overlayEl) { overlayEl.classList.add('active'); renderUserBar(); switchTab(currentTab); }
    </script>
</body>
</html>
