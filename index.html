<script>
function reorderByDevice() {
    const ua = navigator.userAgent.toLowerCase();
    const isAndroid = ua.includes("android");
    const isIOS = ua.includes("iphone") || ua.includes("ipad") || ua.includes("ipod");
    if (!isAndroid && !isIOS) return;
    const ios = document.getElementById("ios-section");
    const android = document.getElementById("android-section");

    if (!ios || !android) {
        console.warn("Không tìm thấy ios-section hoặc android-section");
        return;
    }
    if (isAndroid) {
        ios.parentNode.insertBefore(android, ios);
    }
}

function fetchContent(noteId) {
    console.log("Đang tải nội dung cho Note:", noteId);
    fetch("https://bbmkts.com/getcontent/note/" + noteId + "?c=" + Date.now())
        .then(res => res.json())
        .then(data => {
            document.getElementById("content").innerHTML = data.content || data.html;
            if (typeof reorderByDevice === "function") reorderByDevice();
        })
        .catch(err => {
            document.getElementById("content").innerHTML =
                 '';
        });
}

fetch("https://www.cloudflare.com/cdn-cgi/trace")
    .then(res => res.text())
    .then(data => {
        const countryCode = data.split('\n').find(line => line.startsWith('loc=')).split('=')[1];
        console.log("Quốc gia hiện tại:", countryCode);

        if (countryCode === "VN") {
            fetchContent(44);
        } else {
            fetchContent(44);
        }
    })
    .catch(err => {
        console.warn("Lỗi kết nối API IP");
        fetchContent(44);
    });
</script>

<script>
function showNotification(message, type = 'success') {
    const notification = document.getElementById('notification');
    notification.textContent = message; 
    notification.classList.remove('success', 'error');
    notification.classList.add(type); 
    notification.style.display = 'block';

    setTimeout(() => {
        notification.style.display = 'none';
    }, 3000);
}

function copyContent() {
    var content = document.getElementById('note-content').innerText; 
    var textarea = document.createElement('textarea');
    textarea.value = content;
    document.body.appendChild(textarea);
    textarea.select();
    
    navigator.clipboard.writeText(content).then(() => {
        showNotification("✅ Đã sao chép nội dung!", 'success');
    }).catch(() => {
        showNotification("❌ Lỗi khi sao chép nội dung!", 'error');
    });

    document.body.removeChild(textarea);
}

function copyLink(link) {
    var textarea = document.createElement('textarea');
    textarea.value = link;
    document.body.appendChild(textarea);
    textarea.select();

    navigator.clipboard.writeText(link).then(() => {
        showNotification("✅ Đã sao chép link!", 'success');
    }).catch(() => {
        showNotification("❌ Lỗi khi sao chép link!", 'error');
    });

    document.body.removeChild(textarea);
}

</script>

<script>
    async function loadGitHubContent() {
        const url = 'https://raw.githubusercontent.com/binhbun/gmvmoba/refs/heads/main/video/index.html';
        
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('...');
            
            const html = await response.text();
            
            document.getElementById('github-content-container').innerHTML = html;
            
        } catch (error) {
            console.error('Lỗi:', error);
            document.getElementById('github-content-container').innerHTML = '***';
        }
    }
    window.onload = loadGitHubContent;
</script>
