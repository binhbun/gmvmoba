<!DOCTYPE html>
<html>
<head>
    <title>Đang xử lý...</title>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer-when-downgrade"> <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #0f172a; color: white; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p id="status">Đang kiểm tra bảo mật...</p>

<script>
const secret = "aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J6WkRER3V1ZVFKcE1hY25wQ2UwQmQ2OHRFNkIwRXh4S3JfT05yWDJhU0d2TENSZGJHaVhsbDBTQUlRdUpsY2IwQ1gvZXhlYw==";
const GSHEET_API = atob(secret);

async function getKeyAndRedirect() {
    try {
        document.getElementById('status').innerText = "Đang lấy mã key từ máy chủ...";
        const response = await fetch(GSHEET_API);
        const key = await response.text();

        if (key && key.trim() !== "EMPTY" && key.length > 3) {
            document.getElementById('status').innerText = "Đã lấy được key, đang chuyển hướng...";
            window.location.replace("https://gmvmoba.com/keygame/index.html?key=" + encodeURIComponent(key.trim()));
        } else {
            document.getElementById('status').innerText = "Hết key, vui lòng quay lại sau 10p, hoặc liên hệ admin nếu 30p chưa có key mới!";
        }
    } catch (error) {
        console.error(error);
        document.getElementById('status').innerText = "Lỗi kết nối API Google!";
    }
}

(async function verifyAndStart() {
    const jsonUrl = "https://gmvmoba.com/checks.json"; 
    const fallbackRedirect = "https://gmvmoba.com";

    try {
        const response = await fetch(jsonUrl);
        if (!response.ok) throw new Error("Could not fetch domain list");
        const allowedDomains = await response.json();

        const referrer = document.referrer.toLowerCase();
        let isValid = false;

        if (referrer) {
            try {
                const refHostname = new URL(referrer).hostname.replace('www.', '');
                isValid = allowedDomains.some(domain => {
                    const target = domain.trim().toLowerCase().replace('www.', '');
                    return refHostname === target || refHostname.endsWith("." + target);
                });
            } catch (e) {
                isValid = allowedDomains.some(domain => referrer.includes(domain.trim().toLowerCase()));
            }
        }

        if (isValid) {
            console.log("Referrer hợp lệ!");
            await getKeyAndRedirect();
        } else {
            handleError();
        }

    } catch (error) {
        console.error("Error:", error);
        handleError();
    }

    function handleError() {
        alert("Lỗi: Nguồn truy cập không hợp lệ!");
        window.location.href = fallbackRedirect;
    }
})();
</script>
</body>
</html>
