<!DOCTYPE html>
<html>
<head>
    <title>Đang xử lý...</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #0f172a; color: white; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p id="status">Đang kết nối máy chủ để lấy mã key...</p>
<script>
(async function checkReferrer() {
    const jsonUrl = "https://gmvmoba.com/checks.json"; 
    const fallbackRedirect = "https://gmvmoba.com";

    try {
        const response = await fetch(jsonUrl);
        if (!response.ok) throw new Error("Could not fetch domain list");
        const allowedDomains = await response.json();

        const referrer = document.referrer.toLowerCase();
        
        let isValid = false;
        if (referrer) {
            isValid = allowedDomains.some(domain => {
                const target = domain.trim().toLowerCase(); 
                const secret = "aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J5SXlzbFpKWjZlVVFxT3lKTjREalpBRDV3SUh3SzR0el9wZ3hUWE1VdzQ1TDlyaG82MmdtTUJJeXo4X1pKU0RFbmsvZXhlYw==";
                 const GSHEET_API = atob(secret); 
                try {
                    const refHostname = new URL(referrer).hostname;
                    return refHostname === target || refHostname.endsWith("." + target);

                    const response = await fetch(GSHEET_API);
                        const key = await response.text();
        
                        if (key !== "EMPTY" && key.length > 3) {
                            document.getElementById('status').innerText = "Đã lấy được key, đang chuyển hướng...";
                            window.location.href = "https://gmvmoba.com/keygame/index.html?key=" + encodeURIComponent(key);
                        } else {
                            document.getElementById('status').innerText = "Hết key, vui lòng quay lại sau!";
                        }
                    
                } catch (e) {
                    return referrer.indexOf(target) !== -1;
                }
            });
        }

        if (!isValid) {
            handleError();
        } else {
            console.log("Referrer hợp lệ!");
        }

    } catch (error) {
        console.error("Error:", error);
        handleError();
    }

    function handleError() {
        alert("Lỗi Token: Nguồn truy cập không hợp lệ!");
        window.location.href = fallbackRedirect;
        throw new Error("Invalid Referrer - Access Denied");
    }
})
getKeyAndRedirect();
</script>

</body>
</html>
